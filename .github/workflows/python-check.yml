name: Python Code Check

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  python-check:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install NumPy
        run: |
          python -m pip install --upgrade pip
          pip install numpy

      - name: Run NumPy Practice
        run: |
          python numpy_practices/numpy_day03.py